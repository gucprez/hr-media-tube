name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Backend Python (FastAPI).
  python:
    name: "Python (ruff + pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  # App Android (carpeta android/): APK de depuración + pruebas unitarias.
  # No ejecuta las capturas de pantalla (Robolectric, opcionales) ni pruebas en dispositivo.
  android:
    name: "Android (APK debug + pruebas unitarias)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Plataforma y herramientas de Android
        working-directory: .
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de depuración y correr pruebas (app, protocolo y servidor del estudio)
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest :core-link:test :studio-server:test :studio-server:distZip
      - name: Subir APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: hr-media-sports-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Subir paquete del estudio (laptop)
        uses: actions/upload-artifact@v4
        with:
          name: hr-studio-laptop
          path: android/studio-server/build/distributions/hr-studio.zip
          retention-days: 14
          if-no-files-found: error
      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-resultados-pruebas
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore

  # Estudio de laptop de punta a punta con Chromium y una CÁMARA SIMULADA.
  # Sus resultados son SINTÉTICOS: comprueban el sistema, no miden un teléfono ni una laptop reales.
  estudio-e2e:
    name: "Estudio e2e (cámara simulada, resultados sintéticos)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Empaquetar el estudio
        working-directory: android
        run: ./gradlew --no-daemon :studio-server:installDist
      - name: Instalar Playwright y Chromium
        working-directory: android/studio-server/e2e
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Prueba de extremo a extremo
        working-directory: android/studio-server/e2e
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
          E2E_CSV: ${{ runner.temp }}/e2e/registro-sintetico.csv
        run: |
          mkdir -p "$E2E_OUT"
          node e2e.cjs ../build/install/hr-studio/bin/hr-studio 8799 | tee "$E2E_OUT/comprobaciones.txt"
      - name: Subir resultados SINTÉTICOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-sinteticos-e2e
          path: ${{ runner.temp }}/e2e
          retention-days: 14
          if-no-files-found: ignore
