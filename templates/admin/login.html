<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Faro de Luz Radio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Faro de Luz Radio</h1>
    <p style="color:var(--ink-dim);margin-top:-6px">Panel de administración</p>
    {% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="btn btn--gold" type="submit" style="width:100%;justify-content:center">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
