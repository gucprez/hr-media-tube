{% extends "admin/base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="admin-top">
  <h1>Cambiar contraseña</h1>
</div>

{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
{% if saved %}<div class="alert alert--ok">Contraseña actualizada.</div>{% endif %}

<div class="admin-card" style="max-width:420px">
  <form method="post" action="/admin/config/contrasena">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="current_password">Contraseña actual</label>
      <input type="password" id="current_password" name="current_password" required>
    </div>
    <div class="field">
      <label for="new_password">Nueva contraseña (mínimo 8 caracteres)</label>
      <input type="password" id="new_password" name="new_password" required minlength="8">
    </div>
    <div class="field">
      <label for="confirm_password">Confirmar nueva contraseña</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
    </div>
    <button class="btn btn--gold" type="submit">Actualizar contraseña</button>
  </form>
</div>
{% endblock %}
