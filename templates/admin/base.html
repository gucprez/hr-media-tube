<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Panel{% endblock %} — Faro de Luz Radio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/static/img/favicon-32.png" type="image/png" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-side">
    <div class="admin-side__brand">Faro de Luz<span>PANEL DE ADMINISTRACIÓN</span></div>
    <a href="/admin">Resumen</a>
    <a href="/admin/schedule">Programación</a>
    <a href="/admin/activities">Actividades</a>
    <a href="/admin/news">Noticias</a>
    <a href="/admin/messages">Mensajes</a>
    <a href="/admin/hosts">Voces</a>
    <a href="/admin/config/ajustes">Ajustes (contacto / redes / stream)</a>
    <a href="/admin/config/contrasena">Cambiar contraseña</a>
    <a href="/" target="_blank">Ver sitio público ↗</a>
    <form method="post" action="/admin/logout">
      <button type="submit">Cerrar sesión</button>
    </form>
  </aside>
  <main class="admin-main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
