{% extends "base.html" %}
{% block content %}

<section class="sec-dark section-tight">
  <div class="container reveal is-in">
    <span class="eyebrow">Noticias</span>
    <h1 style="font-size:clamp(2.4rem,6vw,3.6rem);color:#fff;margin-top:16px">Noticias y <span style="color:var(--gold)">anuncios</span></h1>
    <p style="color:var(--fg-dim)">Novedades de nuestra iglesia y de Faro de Luz Radio.</p>
  </div>
</section>

<section class="sec-light section-tight">
  <div class="container">
    <div class="card-grid reveal">
      {% for n in news %}
      <article class="info-card">
        <p class="footer-note">{{ n.date }}</p>
        <h3>{{ n.title }}</h3>
        <p>{{ n.excerpt }}</p>
        <div class="share-row" data-share-text="{{ n.title }} · Faro de Luz Radio">
          <a class="share-btn" data-share="whatsapp" aria-label="Compartir en WhatsApp" href="#">{{ icons.whatsapp|safe }}</a>
          <a class="share-btn" data-share="facebook" aria-label="Compartir en Facebook" href="#">{{ icons.facebook|safe }}</a>
          <button class="share-btn" data-share="native" aria-label="Compartir" type="button">{{ icons.share|safe }}</button>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>

{% endblock %}
