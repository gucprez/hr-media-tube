{% extends "base.html" %}
{% block content %}

<section class="hero" style="padding:56px 0">
  <div class="container">
    <span class="eyebrow">Noticias</span>
    <h1>Noticias y anuncios</h1>
    <p class="hero__tagline">Novedades de nuestra iglesia y de Faro de Luz Radio.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="card-grid">
      {% for n in news %}
      <article class="info-card">
        <p class="footer-note">{{ n.date }}</p>
        <h3>{{ n.title }}</h3>
        <p>{{ n.excerpt }}</p>
        <div class="share-row" data-share-text="{{ n.title }} · Faro de Luz Radio">
          <a class="share-btn" data-share="whatsapp" aria-label="Compartir en WhatsApp" href="#">🟢</a>
          <a class="share-btn" data-share="facebook" aria-label="Compartir en Facebook" href="#">f</a>
          <button class="share-btn" data-share="native" aria-label="Compartir" type="button">⤴</button>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>

{% endblock %}
